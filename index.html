<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Google only shows a site's favicon in Search when it's square with a side that's a multiple
      of 48px, so the icons below are generated from public/logo.png (160x160 — a size Search
      rejects, which is why results showed the default globe). /favicon.ico stays at the root as
      the fallback Googlebot and older browsers request by convention; public/staticwebapp.config.json
      already excludes .ico/.png from the SPA fallback, so these are served as real files.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apprentize — Earn while you search for an apprenticeship</title>
    <meta name="description" content="Browse live apprenticeships and entry-level jobs across England. Get a free daily email the moment a matching role opens — so you can earn now while you train for the future. Completely free." />

    <!--
      Link-preview metadata for shared URLs (WhatsApp, iMessage, Slack). This is a static SPA, so
      every route — including a shared /apprenticeship/<id> link — is served this one document and
      therefore this one card. Per-vacancy titles/descriptions would need the host to render the
      tags server-side (an Azure Function or App Service route ahead of the SPA fallback).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Apprentize" />
    <meta property="og:title" content="Apprentize — Earn while you search for an apprenticeship" />
    <meta property="og:description" content="Browse live apprenticeships and entry-level jobs across England. Get a free daily email the moment a matching role opens — earn now, train for the future." />
    <!-- No og:url — scrapers then attribute the card to the URL that was actually shared.
         og:image, though, must be absolute (scrapers don't resolve relative paths), so it names
         the canonical www host the apex domain redirects to. public/og-image.png is generated
         from the logo and hero copy at the 1200x630 Facebook/X/LinkedIn card size. -->
    <meta property="og:image" content="https://www.apprentize.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Apprentize — search live apprenticeships and entry-level jobs. Every live apprenticeship in England, plus local jobs so you can earn while you search. Free daily alerts." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.apprentize.co.uk/og-image.png" />

    <!-- The hero's live count calls the API as soon as the app mounts; open that connection while
         the bundle is still downloading. Vite fills in the URL from .env / .env.production. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
